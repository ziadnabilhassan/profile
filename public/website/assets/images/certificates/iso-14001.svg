  <text x="400" y="200" font-family="'Inter', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">This certifies that the Environmental Management System of:</text>
  <text x="400" y="245" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#065f46" letter-spacing="1.5" text-anchor="middle">VOLTERA INFRASTRUCTURE SYSTEMS</text>
  <text x="400" y="285" font-family="'Inter', sans-serif" font-size="13" fill="#475569" text-anchor="middle">Conforms with the global environmental standards of:</text>

