  <text x="400" y="340" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#fbbf24" letter-spacing="3" text-anchor="middle">ISO 14001 : 2015</text>

  <text x="400" y="390" font-family="'Inter', sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="600">Scope: Eco-Optimized Manufacturing, Low Carbon Dissipation &amp; WEEE Lifecycle Recycling</text>
